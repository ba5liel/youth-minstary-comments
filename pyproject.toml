[project]
name = "youth-feedback"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ba5liel", email = "baslielselamu2018@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.33.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.3",
]

[project.scripts]
youth-feedback = "youth_feedback:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
